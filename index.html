<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Brothers Barber Shop · Reservas y gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Oswald:wght@400;500;600;700&family=Permanent+Marker&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10;--bg2:#0f1218;--panel:#141820;--card:#181d27;--card2:#1e2430;--line:#272e3b;--line2:#323a4a;
  --tx:#eceef3;--mut:#949aab;--mut2:#6b7284;
  --gold:#f7b324;--gold2:#ffcf4d;--goldd:#c98a0c;
  --blue:#2f6bff;--green:#12b886;--purple:#8b5cf6;--orange:#f59f0b;--cyan:#13b5d1;--red:#e03131;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--gold)}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.hidden{display:none!important}
.mut{color:var(--mut)}.small{font-size:12px}.b{font-weight:700}.gold{color:var(--gold)}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.sp{flex:1}
.stripes{background:repeating-linear-gradient(-45deg,#d62828 0 16px,#fff 16px 30px,#1d3fb8 30px 46px,#fff 46px 60px)}

/* ---------- botones / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;background:var(--card2);border:1px solid var(--line2);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1203;border-color:transparent}
.btn.gold:hover{filter:brightness(1.08);color:#1a1203}
.btn.red{background:#c92a2a;border-color:transparent;color:#fff}
.btn.green{background:#0ca678;border-color:transparent;color:#fff}
.btn.blue{background:var(--blue);border-color:transparent;color:#fff}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;pointer-events:none}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px}
.in{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none}
.in:focus{border-color:var(--gold)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.st-confirmada{background:#0b7a4b;color:#d3f9e4}
.st-en_espera{background:#1f5eff;color:#e3ebff}
.st-pendiente{background:#3a4253;color:#d5d9e2}
.st-atendida{background:#7a5a08;color:#ffe8a3}
.st-cancelada{background:#7d1f1f;color:#ffd5d5}
.st-no_asistio{background:#4a3355;color:#efd8ff}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;padding:10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#ffffff05}
.tblwrap{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--mut)}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chk input{accent-color:var(--gold);width:16px;height:16px}

/* ---------- logo ---------- */
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}
.logo .t1{font-weight:900;font-size:22px;letter-spacing:.02em}
.logo .t1 b{color:var(--gold)}
.logo .t2{font-size:9px;letter-spacing:.18em;color:var(--gold);font-weight:700;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:2px 6px}

/* ---------- público ---------- */
.pub-top{position:sticky;top:0;z-index:30;background:#0a0c10ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.pub-top .in-w{max-width:1180px;margin:auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.pub-top .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.pub-top .brand b{color:var(--gold)}
.pub-nav{display:flex;gap:4px;margin-left:auto}
.pub-nav button{padding:8px 12px;border-radius:8px;font-weight:600;color:var(--mut)}
.pub-nav button:hover{color:var(--tx);background:var(--card)}
@media(max-width:860px){.pub-nav{display:none}}
.wrapc{max-width:1180px;margin:auto;padding:0 20px}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(1200px 400px at 70% 0%,#3a2a0d55,transparent),linear-gradient(180deg,#14110c,#0a0c10)}
.hero .in-w{max-width:1180px;margin:auto;padding:56px 20px 64px;display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}
@media(max-width:860px){.hero .in-w{grid-template-columns:1fr;padding:36px 20px}.hero-art{display:none}}
@media(max-width:600px){.topbar .pubtxt,.topbar .clock{display:none}}
.hero h1{font-size:clamp(44px,7vw,84px);font-weight:900;font-style:italic;line-height:.92;letter-spacing:-.02em}
.hero h1 span{color:var(--gold)}
.hero .tag{font-size:clamp(18px,2.4vw,26px);font-weight:700;font-style:italic;margin:10px 0 6px}
.hero .swoosh{height:4px;width:240px;border-radius:4px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:6px 0 22px}
.neon{font-family:'Kaushan Script',cursive;color:var(--gold2);text-shadow:0 0 6px #ffb20099,0 0 22px #ff9d0077;transform:rotate(-8deg);line-height:1.05}
.hero-art{position:relative;height:300px}
.hero-art .neon{position:absolute;right:0;top:20px;font-size:40px;text-align:right}
.hero-art svg.pole{position:absolute;left:10%;top:10px;height:280px}
.hero-stats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.hero-stats div b{display:block;font-size:22px;color:var(--gold)}
.hero-stats div{color:var(--mut);font-size:12px;font-weight:600}
section.pub{padding:56px 0}
.sec-h{display:flex;align-items:end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.sec-h h2{font-size:28px;font-weight:900;font-style:italic}
.sec-h h2 span{color:var(--gold)}
.sec-h p{color:var(--mut)}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.svc{position:relative;border-radius:var(--r);padding:20px;color:#fff;overflow:hidden;min-height:150px;display:flex;flex-direction:column;gap:6px;text-align:left;transition:.18s;border:2px solid transparent}
.svc:hover{transform:translateY(-3px)}
.svc.sel{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
.svc .ic{width:44px;height:44px;border-radius:12px;background:#ffffff26;display:grid;place-items:center;margin-bottom:6px}
.svc .ic svg{width:26px;height:26px}
.svc h3{font-size:17px;font-weight:800}
.svc .meta{display:flex;gap:10px;font-size:12px;font-weight:600;opacity:.92;margin-top:auto}
.svc .price{font-size:20px;font-weight:900}
.c0{background:linear-gradient(135deg,#2f6bff,#1a4fd6)}.c1{background:linear-gradient(135deg,#14b886,#0b8c73)}.c2{background:linear-gradient(135deg,#9b6bff,#6d3fe0)}.c3{background:linear-gradient(135deg,#f7a21b,#e07b06)}.c4{background:linear-gradient(135deg,#17c0d8,#0a8ea8)}.c5{background:linear-gradient(135deg,#ef5a6f,#c22a49)}
.wizard{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.steps{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.steps div{flex:1;min-width:130px;padding:14px 16px;display:flex;gap:10px;align-items:center;color:var(--mut2);font-weight:700;font-size:13px;border-bottom:3px solid transparent}
.steps div i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-style:normal;font-size:12px}
.steps div.on{color:var(--tx);border-color:var(--gold)}
.steps div.on i{background:var(--gold);color:#1a1203}
.steps div.ok{color:var(--mut)}
.steps div.ok i{background:#0ca678;color:#fff}
.wz-body{padding:24px}
.wz-foot{display:flex;gap:10px;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--line);background:var(--bg2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);font-weight:600;display:inline-flex;gap:8px;align-items:center}
.chip.on{background:var(--gold);color:#1a1203;border-color:var(--gold)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.day{min-width:68px;padding:10px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);text-align:center;font-weight:700}
.day small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.day b{font-size:20px;display:block}
.day.on{background:var(--gold);color:#1a1203;border-color:var(--gold)}
.day.on small{color:#3b2a05}
.day.off{opacity:.35;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{padding:10px 4px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);font-weight:700;font-size:13px;text-align:center}
.slot:hover{border-color:var(--gold)}
.slot.on{background:var(--gold);color:#1a1203;border-color:var(--gold)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.sum .ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sum .ln:last-child{border:0}
.paybox{border:1px solid var(--line2);border-radius:12px;padding:14px;background:var(--bg2)}
.ticket{max-width:520px;margin:auto;text-align:center;padding:10px}
.ticket .code{font-size:30px;font-weight:900;letter-spacing:.08em;color:var(--gold);margin:6px 0}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prod .img{height:120px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a2f3b,#14171e)}
.prod .bd{padding:14px}
.prod h4{font-size:15px;font-weight:800}
footer.pub{border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:12px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
.login:before{content:"";position:absolute;inset:-50%;opacity:.08;background:repeating-linear-gradient(-45deg,#d62828 0 30px,#fff 30px 60px,#1d3fb8 60px 90px,#fff 90px 120px)}
.login-card{position:relative;width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 20px 60px #000a}

/* ---------- panel ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:#0c0e13;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.side .lg{padding:22px 10px 18px;display:flex;justify-content:center}
.nav{display:flex;flex-direction:column;gap:4px;padding:0 12px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-weight:600;color:#c9cdd8;text-align:left}
.nav button:hover{background:var(--card)}
.nav button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1203;box-shadow:0 0 0 1px #ffd76a inset}
.nav button .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:1px 7px}
.side .usr{margin-top:auto;padding:14px 12px;border-top:1px solid var(--line)}
.side .usr .who{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 4px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:#fff}
.side .foot-str{height:60px;margin:0 -12px -14px;clip-path:polygon(0 40%,100% 0,100% 100%,0 100%)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.topbar .bell{position:relative;padding:6px}
.topbar .bell .n{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:10px;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;font-weight:700}
.content{padding:22px;display:flex;flex-direction:column;gap:18px}
.banner{position:relative;border-radius:16px;overflow:hidden;min-height:170px;display:flex;align-items:center;padding:24px 30px;background:radial-gradient(600px 200px at 75% 50%,#4a3510aa,transparent),linear-gradient(90deg,#111318,#1c1810 60%,#14110a);border:1px solid var(--line)}
.banner h1{font-size:clamp(34px,5vw,58px);font-weight:900;font-style:italic;line-height:.95}
.banner h1 span{color:var(--gold)}
.banner .tag{font-size:18px;font-weight:700;font-style:italic;margin-top:4px}
.banner .neon{position:absolute;right:30px;top:50%;transform:translateY(-50%) rotate(-8deg);font-size:28px;text-align:right}
@media(max-width:760px){.banner .neon{display:none}}
.mods{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:1100px){.mods{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.mods{grid-template-columns:repeat(2,1fr)}}
.mod{border-radius:var(--r);padding:18px 14px 34px;color:#fff;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.mod:hover{transform:translateY(-2px);filter:brightness(1.08)}
.mod svg.i{width:48px;height:48px;stroke-width:1.7;margin-bottom:6px}
.mod b{font-size:16px;font-weight:800}
.mod small{font-size:11px;opacity:.9}
.mod .go{position:absolute;right:10px;bottom:10px;width:22px;height:22px;border-radius:50%;background:#ffffff40;display:grid;place-items:center}
.mod .go svg{width:14px;height:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:15px;font-weight:800}
.card-h .ic{color:var(--gold)}
.dash3{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:14px}
@media(max-width:1100px){.dash3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.dash3{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .h{font-size:11px;color:var(--mut);font-weight:700;padding:4px 0}
.cal .d{position:relative;padding:7px 0;border-radius:50%;font-weight:600;aspect-ratio:1;display:grid;place-items:center;max-width:38px;margin:auto;width:100%}
.cal .d:hover{background:var(--card2)}
.cal .d.o{color:var(--mut2)}
.cal .d.t{background:var(--gold);color:#1a1203;font-weight:800}
.cal .d .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--gold)}
.cal .d.t .dot{background:#1a1203}
.nx{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.nx:last-child{border:0}
.fin-big{font-size:34px;font-weight:900}
.minibars{display:flex;align-items:end;gap:7px;height:80px}
.minibars div{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--gold2),var(--goldd));min-height:4px;position:relative}
.minibars div span{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.tile{border-radius:12px;padding:12px 8px;text-align:center;color:#fff}
.tile b{display:block;font-size:16px;font-weight:900;margin:4px 0 0}
.tile small{font-size:11px;opacity:.9}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.kpi small{color:var(--mut);font-weight:600;font-size:12px}
.kpi b{display:block;font-size:24px;font-weight:900;margin-top:4px}
.kpi:after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--gold))}
.strip{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;position:relative;overflow:hidden}
.strip:before,.strip:after{content:"";position:absolute;bottom:0;width:120px;height:100%;background:repeating-linear-gradient(-45deg,#d62828 0 10px,#fff 10px 18px,#1d3fb8 18px 28px,#fff 28px 36px);opacity:.9}
.strip:before{left:0;clip-path:polygon(0 60%,100% 100%,0 100%)}
.strip:after{right:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph h2{font-size:22px;font-weight:900}
.hbar{display:flex;flex-direction:column;gap:9px}
.hbar .r{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;font-size:13px}
.hbar .tr{height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px;background:var(--gold)}
.hbar .v{text-align:right;font-weight:700}
.vchart{display:flex;align-items:end;gap:14px;height:180px;padding:10px 0 24px}
.vchart .g{flex:1;display:flex;gap:4px;align-items:end;height:100%;position:relative}
.vchart .g i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.vchart .g span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* agenda */
.tl{display:grid;border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--bg2);max-height:640px}
.tl-head{position:sticky;top:0;z-index:3;background:var(--panel);padding:10px;font-weight:800;border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:13px}
.tl-hours{position:relative;border-right:1px solid var(--line)}
.tl-hours div{position:absolute;right:6px;font-size:11px;color:var(--mut);transform:translateY(-7px)}
.tl-col{position:relative;border-left:1px solid var(--line)}
.tl-col .ln{position:absolute;left:0;right:0;border-top:1px solid #ffffff0d}
.tl-col .brk{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#ffffff06 0 6px,transparent 6px 12px)}
.ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 8px;font-size:12px;overflow:hidden;text-align:left;border-left:4px solid;line-height:1.25}
.ev b{display:block;font-size:12px}
.ev.st-confirmada{background:#0f3d2c;border-color:#20c997;color:#d3f9e4}
.ev.st-en_espera{background:#132a5c;border-color:#4c8bff;color:#e3ebff}
.ev.st-pendiente{background:#262c38;border-color:#8b93a6;color:#dfe3ea}
.ev.st-atendida{background:#3a2c08;border-color:var(--gold);color:#ffe8a3}
.ev.st-no_asistio{background:#2b2033;border-color:#b07fd0;color:#efd8ff}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--red);z-index:2}

/* modal / toast */
.ov{position:fixed;inset:0;background:#000b;z-index:100;display:grid;place-items:center;padding:16px}
.mdl{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 80px #000}
.mdl.lg{width:min(820px,100%)}
.mdl-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.mdl-h h3{font-size:17px;font-weight:800}
.mdl-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.mdl-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
#toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card2);border:1px solid var(--line2);border-left:4px solid var(--gold);padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px #0008;max-width:340px;font-weight:600;animation:tin .2s}
.toast.err{border-left-color:var(--red)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.net{background:#5c3d00;color:#ffe3a3;padding:8px 16px;font-size:12px;font-weight:600;text-align:center}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:8px;background:var(--card2);border:1px solid var(--line2);font-weight:800}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:60;transform:translateX(-100%);transition:.2s}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax #0009}
  .content{padding:14px}
}

/* ===== Tema The Brothers ===== */
:root{--bg:#060606;--bg2:#0d0d0d;--panel:#111111;--card:#151515;--card2:#1c1b19;--line:#2a2722;--line2:#3b352b;--gold:#f2b632;--gold2:#ffd15c;--goldd:#b9830f;--tx:#f3f1ec;--mut:#a7a094;--mut2:#6f6a60}
h1,h2,h3,h4,.btn,.nav button,.steps div,.chip,.kpi b,.fin-big,.ph h2,.card-h h3,.tile b,.day b,.slot,.mdl-h h3,.ticket .code{font-family:Oswald,Montserrat,sans-serif}
.btn{font-weight:600;letter-spacing:.02em;font-size:14px}
.btn.sm{font-size:13px}
.btn.gold{background:linear-gradient(180deg,#ffd468,#e9a91f);color:#141005;box-shadow:0 4px 16px #f2b63226}
.btn.outline{background:transparent;border:1.5px solid var(--gold);color:var(--gold2)}
.btn.outline:hover{background:#f2b6321a}
.btn.lg{padding:14px 26px;font-size:18px;border-radius:12px}
.card,.kpi,.wizard,.sum,.prod{background:linear-gradient(180deg,#141414,#0e0e0e)}
.chip.on,.day.on,.slot.on{background:linear-gradient(180deg,#ffd468,#e9a91f);color:#141005}
.steps div.on i{background:var(--gold)}
/* barra superior pública */
.lb-top{position:sticky;top:0;z-index:30;background:#070707f0;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.lb-top .in-w{max-width:1280px;margin:auto;display:flex;align-items:center;gap:20px;padding:8px 22px}
.lb-top .lg img{height:64px;display:block}
.lb-top .vsep{width:1px;height:46px;background:linear-gradient(180deg,transparent,var(--gold),transparent)}
.lb-nav{display:flex;gap:6px}
.lb-nav button{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-family:Oswald;font-size:16px;color:#ece8df}
.lb-nav button.on{background:linear-gradient(180deg,#ffd468,#e9a91f);color:#141005;box-shadow:0 2px 12px #f2b63240}
.lb-nav button:hover:not(.on){color:var(--gold2)}
@media(max-width:1000px){.lb-nav,.lb-top .vsep{display:none}.lb-top .lg img{height:52px}}
/* héroe */
.lb-hero{position:relative;min-height:430px;background:#050505;overflow:hidden;border-bottom:1px solid var(--line)}
.lb-hero .art{position:absolute;top:0;bottom:0;right:0;width:64%;background-size:cover;background-position:center}
.lb-hero .art:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#050505 0%,#05050500 9%),linear-gradient(0deg,#050505aa,transparent 30%)}
.lb-hero .in-w{position:relative;max-width:1280px;margin:auto;padding:26px 22px 36px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.lb-hero .big{width:min(500px,92%);display:block;filter:drop-shadow(0 8px 24px #000)}
.lb-hero .meta{font-size:13px;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap}
.lb-hero .meta span{display:flex;gap:6px;align-items:center}.lb-hero .meta svg{color:var(--gold)}
@media(max-width:860px){.lb-hero .art{width:100%;opacity:.3}.lb-hero .in-w{align-items:center;text-align:center}}
/* secciones */
.lb-sec{max-width:1280px;margin:auto;padding:34px 22px}
.lb-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.lb-h h2{font-family:Oswald;font-size:32px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.lb-h h2 em{font-style:normal;font-family:'Permanent Marker',cursive;color:#fff;text-transform:none}
.lb-h small{display:block;color:var(--gold);font-family:Oswald;font-size:15px;letter-spacing:.06em;margin-bottom:4px}
.lb-h p{color:var(--mut)}
.lb-h .cr{color:var(--gold);width:30px;height:30px}
.lb-svcwrap{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:center}
.lb-svcwrap .ttl img{width:100%;max-width:250px;display:block}
.lb-svcwrap .ttl p{margin-top:8px}
@media(max-width:860px){.lb-svcwrap{grid-template-columns:1fr}.lb-svcwrap .ttl{display:flex;flex-direction:column;align-items:center;text-align:center}}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.lbsvc{background:linear-gradient(180deg,#171717,#0b0b0b);border:1px solid var(--line2);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.18s;cursor:pointer;text-align:center}
.lbsvc:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 12px 30px #000c}
.lbsvc.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.lbsvc.off{opacity:.45}
.lbsvc .pht{height:118px;background-size:cover;background-position:center;position:relative}
.lbsvc .dur{position:absolute;left:10px;top:10px;background:#000d;border:1px solid var(--line2);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;display:flex;gap:4px;align-items:center}
.lbsvc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;align-items:center;flex:1}
.lbsvc h3{font-size:19px;font-weight:600}
.lbsvc p{font-size:12px;color:var(--mut)}
.lbsvc .pr{font-family:Oswald;font-size:20px;color:var(--gold2);margin:4px 0 10px}
.lbsvc .btn{margin-top:auto;padding:7px 26px}
.lb-row3{display:grid;grid-template-columns:1.05fr 1.15fr .95fr;gap:18px}
@media(max-width:1060px){.lb-row3{grid-template-columns:1fr}}
.lbcard{position:relative;border:1px solid #7a5c1c;border-radius:14px;overflow:hidden;background:#0a0a0a;min-height:236px;box-shadow:inset 0 0 0 1px #00000080}
.lb-barb{display:grid;grid-template-columns:1fr 1.1fr}
.lb-barb .txt{padding:18px;display:flex;flex-direction:column;gap:10px}
.lb-barb .img{background-size:cover;background-position:center}
.lb-barb .bl{display:flex;flex-wrap:wrap;gap:6px}
.lb-barb .chip{padding:5px 10px 5px 5px;font-size:12px}
@media(max-width:560px){.lb-barb{grid-template-columns:1fr}.lb-barb .img{height:200px}}
.lb-agenda{display:grid;grid-template-columns:1.45fr .75fr}
.lb-agenda .frm{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.lb-agenda .dec{background-size:cover;background-position:center}
@media(max-width:560px){.lb-agenda{grid-template-columns:1fr}.lb-agenda .dec{display:none}}
.lb-agenda h3,.lb-cuenta h3{font-size:22px;display:flex;gap:10px;align-items:center;font-weight:600}
.lb-agenda h3 svg,.lb-cuenta h3 svg{color:var(--gold)}
.qsel{position:relative}
.qsel>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gold);width:16px;height:16px;pointer-events:none}
.qsel .in{padding:8px 30px 8px 34px;font-size:13px;background-color:#0d0d0d}
.lb-cuenta{padding:20px;display:flex;flex-direction:column;gap:12px;background-repeat:no-repeat;background-position:right center;background-size:auto 100%}
.lb-cuenta:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0a0a0a 38%,#0a0a0a00 75%);pointer-events:none}
.lb-cuenta>*{position:relative;max-width:62%}
.lb-foot{background:#050505;border-top:1px solid var(--line);margin-top:20px}
.lb-stripe{height:8px;background:repeating-linear-gradient(-45deg,var(--gold) 0 14px,#050505 14px 28px)}
.lb-foot .in-w{max-width:1280px;margin:auto;padding:16px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.soc{width:38px;height:38px;border:1.5px solid #e7e3da;border-radius:10px;display:grid;place-items:center;color:#eee}
a.soc:hover{border-color:var(--gold);color:var(--gold2)}
/* panel */
.side{background:#070707}
.side .lg img{width:180px;display:block}
.nav button.on{background:linear-gradient(180deg,#ffd468,#e9a91f);box-shadow:none}
.banner{background:#050505;min-height:200px;padding:16px 28px;border-color:#5a4416}
.banner .art{position:absolute;top:0;bottom:0;right:0;width:64%;background-size:cover;background-position:center}
.banner .art:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#050505,#05050500 22%)}
.banner .cont{position:relative;z-index:1}
.banner img.hl{height:130px;display:block;margin-bottom:8px;filter:drop-shadow(0 6px 18px #000)}
.banner .row span{background:#000b;border:1px solid var(--line2);padding:5px 10px;border-radius:999px}
.banner .row svg{color:var(--gold)}
@media(max-width:760px){.banner .art{width:100%;opacity:.3}}
.mod{background:linear-gradient(180deg,#191816,#0c0c0c)!important;border:1px solid var(--line2);color:var(--tx)}
.mod svg.i{color:var(--gold)}
.mod:hover{border-color:var(--gold);filter:none}
.mod small{color:var(--mut)}
.mod .go{background:var(--gold);color:#141005}
.tile{background:#0d0d0d!important;border:1px solid var(--line2)}
.tile b{color:var(--gold2);font-size:17px}
.tile svg{color:var(--gold)}
.tile small{color:var(--mut)}
.login-card img.logo-img{width:250px;display:block}
.login:before{opacity:.05}

.lb-hero .big,.banner img.hl{-webkit-mask-image:radial-gradient(ellipse 72% 68% at 50% 52%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 68% at 50% 52%,#000 62%,transparent 100%)}
.lb-top .lg img,.side .lg img,.login-card img.logo-img{-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 70%,transparent 100%)}
.mod .go svg.i{color:#141005;width:14px;height:14px;margin:0}
@media(min-width:1100px){.lb-svcwrap .lb-grid{grid-template-columns:repeat(3,1fr)}}
.lb-barb{grid-template-columns:1fr 1.25fr}
.lb-barb .img{background-position:60% 30%}
@media(max-width:560px){.lb-grid{grid-template-columns:1fr 1fr;gap:10px}.lbsvc .pht{height:86px}.lbsvc h3{font-size:15px}.lbsvc p{font-size:11px}.lbsvc .pr{font-size:16px;margin:2px 0 8px}.lbsvc .btn{padding:6px 14px}}
.lb-svcwrap .ttl img,.lb-barb .txt img{-webkit-mask-image:radial-gradient(ellipse 75% 75% at 50% 50%,#000 65%,transparent 100%);mask-image:radial-gradient(ellipse 75% 75% at 50% 50%,#000 65%,transparent 100%)}
.lb-agenda .dec{background-size:contain;background-repeat:no-repeat;background-color:#0a0a0a}
.lb-barb .img{background-size:cover;background-position:50% 20%}
.lb-barb{display:block;background-repeat:no-repeat;background-size:auto 100%;background-position:right center}
.lb-barb:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0a0a0a 36%,#0a0a0acc 50%,#0a0a0a00 70%);pointer-events:none}
.lb-barb .txt{position:relative;max-width:56%;height:100%}
.lb-cuenta:before{background:linear-gradient(90deg,#0a0a0a 32%,#0a0a0a00 62%)}
@media(max-width:560px){.lb-barb .txt{max-width:70%}}
.lb-hero .big{width:min(430px,92%)}
@media(min-width:861px){.lb-hero .art{width:60%}}
.lb-hero .art:before{background:linear-gradient(90deg,#050505 0%,#05050500 3%),linear-gradient(0deg,#050505aa,transparent 30%)}
</style>

const wq={};
function queueWrite(path,fn){wq[path]=(wq[path]||Promise.resolve()).then(fn).catch(e=>{
  if(e&&e.code==='invalid_argument'){readOnly=true;toast('No tienes permiso para guardar cambios en esta barbería.','err')}

  else if(e&&e.code==='unavailable'){return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(fn).catch(()=>toast('No se pudo guardar. Revisa tu conexión.','err'))}
  else toast('No se pudo guardar el cambio.','err');

async function ensureSeed(col){

async function saveItem(col,obj,silent){
  if(col==='servicios'||col==='barberos'){if(!S[col].length&&!silent)await ensureSeed(col)}
  const i=S[col].findIndex(x=>x.id===obj.id);
  if(i>=0)S[col][i]=obj;else S[col].push(obj);

async function delItem(col,id){

async function initDB(){
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db)return;
  let canW=null;try{const u=await window.claude.use('user');canW=u?await u.can('data.write'):null}catch(e){canW=null}
  if(canW!==true)return;
  DB=db;dbMode='db';$('#net').classList.add('hidden');
  COLS.forEach(c=>S[c]=[]);S.config=null;
  const net=$('#net');let confirmed=0;const total=COLS.length+1;
  const timer=setTimeout(()=>{if(confirmed<total){net.textContent='No se ha podido conectar con la base de datos todavía; los datos mostrados pueden no estar actualizados.';net.classList.remove('hidden')}},10000);
  const ok=(snap)=>{if(snap&&snap.metadata&&!snap.metadata.fromCache){confirmed++;if(confirmed>=total){clearTimeout(timer);net.classList.add('hidden')}}};
  const errH=e=>{clearTimeout(timer);if(e&&e.code==='revoked'){net.textContent='Acceso a los datos no disponible en esta vista.';net.classList.remove('hidden')}};
  COLS.forEach(c=>{let first=true;db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(first&&!snap.metadata.fromCache){first=false;ok(snap)}scheduleRender()},errH)});
  let f1=true;db.doc('app/config').onSnapshot(s=>{S.config=s.exists?Object.assign({},s.data()):null;if(f1&&!s.metadata.fromCache){f1=false;ok(s)}scheduleRender()},errH);
}

function diaAbierto(f){return cfg().dias.map(Number).includes(parseD(f).getDay())}
function ocupado(bid,f,ini,fin,excl){return S.citas.some(c=>c.barberoId===bid&&c.fecha===f&&c.id!==excl&&activa(c)&&toMin(c.hora)<fin&&toMin(c.hora)+Number(c.duracion)>ini)}
function slotsLibres(bid,f,dur,excl){
  const c=cfg();if(f<today()||!diaAbierto(f))return[];
  const a=toMin(c.apertura),z=toMin(c.cierre),st=Number(c.intervalo)||15;
  const di=c.descansoIni?toMin(c.descansoIni):null,df=c.descansoFin?toMin(c.descansoFin):null;
  const nowM=new Date().getHours()*60+new Date().getMinutes(),isT=f===today();const out=[];
  for(let t=a;t+dur<=z;t+=st){if(isT&&t<nowM+10)continue;if(di!=null&&df!=null&&t<df&&t+dur>di)continue;if(ocupado(bid,f,t,t+dur,excl))continue;out.push(t)}
  return out}
function slotsAny(f,dur){const m={};barberos().filter(b=>b.activo!==false).forEach(b=>slotsLibres(b.id,f,dur).forEach(t=>{(m[t]=m[t]||[]).push(b.id)}));return m}

function finMes(ym,bid){
  const ms=S.movimientos.filter(m=>ymOf(m.fecha)===ym&&(!bid||m.barberoId===bid));
  const ing=ms.filter(m=>m.tipo==='ingreso'),egr=ms.filter(m=>m.tipo==='egreso');
  return {ms,ing,egr,ti:sum(ing,m=>m.monto),te:sum(egr,m=>m.monto),ef:sum(ing.filter(m=>m.metodo==='efectivo'),m=>m.monto),dg:sum(ing.filter(m=>m.metodo!=='efectivo'),m=>m.monto)}}

function pInicio(){
  const c=cfg();const ym=today().slice(0,7);const bid=isAdmin()?null:SES.barberoId;
  const f=finMes(ym,bid),fp=finMes(ymAdd(ym,-1),bid);
  const dd=today().slice(8);const fpp=sum(fp.ing.filter(m=>m.fecha.slice(8)<=dd),m=>m.monto);const delta=fpp?Math.round((f.ti-fpp)/fpp*100):null;
  const months=Array.from({length:6},(_,i)=>ymAdd(ym,i-5));const mv=months.map(m=>finMes(m,bid).ti);const mx=Math.max(1,...mv);
  const now=today()+' '+nowHM();
  const prox=misCitas().filter(x=>activa(x)&&x.estado!=='atendida'&&(x.fecha+' '+x.hora)>=today()+' '+toHM(Math.max(0,toMin(nowHM())-30))).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).slice(0,4);

function calCard(){
  const ym=P.calMes;const d0=parseD(ym+'-01');const start=new Date(d0);start.setDate(1-d0.getDay());
  const cnt={};misCitas().filter(activa).forEach(c=>cnt[c.fecha]=(cnt[c.fecha]||0)+1);
  let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=dstr(d);cells+=`<button class="d ${d.getMonth()!==d0.getMonth()?'o':''} ${s===today()?'t':''}" data-act="calDay" data-d="${s}" title="${cnt[s]?cnt[s]+' citas':''}">${d.getDate()}${cnt[s]?'<span class="dot"></span>':''}</button>`}
  return `<div class="card-h"><span class="ic">${ico('cal')}</span><h3>Calendario de citas</h3><span class="sp"></span><button class="btn sm" data-act="nav" data-m="agenda">Ver todo ${ico('arrow')}</button></div>
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn ghost sm" data-act="calMes" data-n="-1">${ico('left')}</button><b>${ymLabel(ym)}</b><button class="btn ghost sm" data-act="calMes" data-n="1">${ico('right')}</button></div>
  <div class="cal">${DIAS.map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>`}

  <div class="card"><div class="row wrap" style="margin-bottom:14px">
    <button class="btn sm" data-act="agDay" data-n="-1">${ico('left')}</button><button class="btn sm" data-act="agHoy">Hoy</button><button class="btn sm" data-act="agDay" data-n="1">${ico('right')}</button>
    <input type="date" class="in" style="width:auto" id="ag-date" value="${f}"><b style="font-size:16px">${fLarga(f)}</b>${diaAbierto(f)?'':'<span class="badge st-cancelada">Cerrado</span>'}<span class="sp"></span>
    ${isAdmin()?`<select class="in" id="ag-barb" style="width:auto"><option value="all">Todos los barberos</option>${barberos().filter(b=>b.activo!==false).map(b=>`<option value="${b.id}" ${P.agBarb===b.id?'selected':''}>${esc(b.nombre)}</option>`).join('')}</select>`:''}</div>
    <div class="legend wrap" style="margin-bottom:10px">${['confirmada','en_espera','pendiente','atendida','no_asistio'].map(e=>`<span><i class="st-${e}"></i>${ESTADOS[e]}</span>`).join('')}</div>
    <div class="tl" style="grid-template-columns:56px repeat(${bs.length},minmax(170px,1fr))">
      <div class="tl-head" style="border-left:0"></div>${bs.map(b=>`<div class="tl-head"><span class="avatar" style="width:26px;height:26px;font-size:10px;background:${b.color}">${esc(initials(b.nombre))}</span>${esc(b.nombre)}<span class="sp"></span><span class="small mut">${dia.filter(x=>x.barberoId===b.id&&activa(x)).length}</span></div>`).join('')}
      <div class="tl-hours" style="height:${H}px">${hours.map(t=>`<div style="top:${(t-a)*PX}px">${h12(toHM(t)).replace(':00','')}</div>`).join('')}</div>${cols}

/* ---- Clientes ---- */
function clientesAgg(){
  const m={};S.clientes.forEach(c=>m[digits(c.telefono)]={...c,visitas:0,gastado:0,ultima:'',proxima:'',citas:0});
  S.citas.forEach(x=>{const k=digits(x.telefono);if(!k)return;if(!m[k])m[k]={id:'c'+k,nombre:x.cliente,telefono:x.telefono,visitas:0,gastado:0,ultima:'',proxima:'',citas:0,notas:''};const o=m[k];o.citas++;
    if(x.estado==='atendida'){o.visitas++;o.gastado+=Number(x.precio)||0;if(x.fecha>o.ultima)o.ultima=x.fecha}
    if(activa(x)&&x.estado!=='atendida'&&x.fecha>=today()&&(!o.proxima||x.fecha<o.proxima))o.proxima=x.fecha});
  return Object.values(m)}
function pClientes(){
  const q=P.cliQ.toLowerCase();const list=clientesAgg().filter(c=>!q||String(c.nombre).toLowerCase().includes(q)||digits(c.telefono).includes(digits(q)||'~')).sort((a,b)=>b.visitas-a.visitas||String(a.nombre).localeCompare(b.nombre));
  const all=clientesAgg();
  return `<div class="ph"><h2>Clientes</h2><span class="sp"></span><button class="btn gold" data-act="editCliente">${ico('plus')} Nuevo cliente</button></div>
  <div class="kpis"><div class="kpi" style="--k:var(--green)"><small>Clientes registrados</small><b>${all.length}</b></div><div class="kpi" style="--k:var(--blue)"><small>Clientes recurrentes (2+ visitas)</small><b>${all.filter(c=>c.visitas>=2).length}</b></div><div class="kpi"><small>Con cita próxima</small><b>${all.filter(c=>c.proxima).length}</b></div></div>
  <div class="card"><div class="row" style="margin-bottom:12px"><input class="in" id="cli-q" placeholder="Buscar por nombre o celular…" value="${esc(P.cliQ)}" style="max-width:320px"></div>

/* ---- Caja y contabilidad ---- */
const CAT_EGR=['Arriendo','Servicios públicos','Insumos','Compra de productos','Comisiones barberos','Nómina','Publicidad','Mantenimiento','Impuestos','Devoluciones','Otros'];
const CAT_ING=['Abonos','Servicios','Productos','Propinas','Otros ingresos'];
function pCaja(){
  const ym=P.cajaMes;const f=finMes(ym);
  const byCat=(arr)=>{const m={};arr.forEach(x=>m[x.categoria]=(m[x.categoria]||0)+Number(x.monto));return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const bars=(rows,col)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return rows.length?`<div class="hbar">${rows.map(([k,v])=>`<div class="r"><span>${esc(k)}</span><div class="tr"><i style="width:${v/mx*100}%;background:${col}"></i></div><span class="v">${fmt(v)}</span></div>`).join('')}</div>`:'<div class="empty">Sin movimientos.</div>'};
  const met={};f.ing.forEach(m=>met[m.metodo]=(met[m.metodo]||0)+Number(m.monto));
  const hoy=S.movimientos.filter(m=>m.fecha===today());const hi=hoy.filter(m=>m.tipo==='ingreso'),he=hoy.filter(m=>m.tipo==='egreso');
  const efHoy=sum(hi.filter(m=>m.metodo==='efectivo'),m=>m.monto)-sum(he.filter(m=>m.metodo==='efectivo'),m=>m.monto);
  const list=f.ms.filter(m=>P.movTipo==='all'||m.tipo===P.movTipo).sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));
  const pendAb=sum(S.citas.filter(c=>c.estado==='en_espera'),c=>c.abono);
  return `<div class="ph"><h2>Caja y Contabilidad</h2><span class="sp"></span><button class="btn sm" data-act="cajaMes" data-n="-1">${ico('left')}</button><b>${ymLabel(ym)}</b><button class="btn sm" data-act="cajaMes" data-n="1">${ico('right')}</button></div>
  <div class="kpis"><div class="kpi" style="--k:var(--green)"><small>Ingresos del mes</small><b>${fmt(f.ti)}</b></div><div class="kpi" style="--k:var(--red)"><small>Egresos del mes</small><b>${fmt(f.te)}</b></div><div class="kpi"><small>Utilidad neta</small><b style="color:${f.ti-f.te>=0?'var(--gold2)':'#ff6b6b'}">${fmt(f.ti-f.te)}</b></div><div class="kpi" style="--k:var(--purple)"><small>Margen</small><b>${f.ti?Math.round((f.ti-f.te)/f.ti*100):0}%</b></div><div class="kpi" style="--k:var(--blue)"><small>Abonos por verificar</small><b>${fmt(pendAb)}</b></div></div>
  <div class="dash3">
    <div class="card"><div class="card-h"><span style="color:#20c997">${ico('up')}</span><h3>Ingresos por concepto</h3></div>${bars(byCat(f.ing),'#20c997')}</div>
    <div class="card"><div class="card-h"><span style="color:#ff6b6b">${ico('down')}</span><h3>Egresos por concepto</h3></div>${bars(byCat(f.egr),'#ff6b6b')}</div>
    <div class="card"><div class="card-h"><span class="ic">${ico('wallet')}</span><h3>Cierre de caja · hoy</h3></div>
      <div class="sum"><div class="ln"><span class="mut">Ingresos hoy</span><b>${fmt(sum(hi,m=>m.monto))}</b></div><div class="ln"><span class="mut">Egresos hoy</span><b>${fmt(sum(he,m=>m.monto))}</b></div><div class="ln"><span class="gold b">Efectivo esperado en caja</span><b class="gold">${fmt(efHoy)}</b></div></div>
      <div class="small mut b" style="margin:12px 0 6px">Ingresos del mes por método</div>${bars(Object.entries(met).map(([k,v])=>[METODOS[k]||k,v]).sort((a,b)=>b[1]-a[1]),'var(--gold)')}</div>
  </div>
  <div class="card"><div class="row wrap" style="margin-bottom:12px"><h3 style="font-size:15px;font-weight:800">Libro de movimientos</h3><span class="sp"></span>
    <div class="chips">${[['all','Todos'],['ingreso','Ingresos'],['egreso','Egresos']].map(([k,v])=>`<button class="chip ${P.movTipo===k?'on':''}" data-act="movTipo" data-t="${k}">${v}</button>`).join('')}</div>
    <button class="btn sm" data-act="copyCSV">${ico('copy')} Copiar CSV</button><button class="btn green sm" data-act="newMov" data-t="ingreso">${ico('plus')} Ingreso</button><button class="btn red sm" data-act="newMov" data-t="egreso">${ico('plus')} Egreso</button></div>
  ${list.length?`<div class="tblwrap"><table class="tbl"><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Método</th><th>Barbero</th><th style="text-align:right">Valor</th><th></th></tr>${list.map(m=>`<tr><td>${fCorta(m.fecha)} <span class="small mut">${esc(m.hora||'')}</span></td><td>${esc(m.concepto)}</td><td>${esc(m.categoria)}</td><td>${METODOS[m.metodo]||esc(m.metodo||'')}</td><td>${m.barberoId?esc(barb(m.barberoId).nombre):'—'}</td><td style="text-align:right" class="b" ><span style="color:${m.tipo==='ingreso'?'#20c997':'#ff6b6b'}">${m.tipo==='ingreso'?'+':'−'} ${fmt(m.monto)}</span></td><td><button class="btn ghost sm" data-act="delMov" data-id="${m.id}" aria-label="Eliminar">${ico('trash')}</button></td></tr>`).join('')}</table></div>`:`<div class="empty">Sin movimientos en ${ymLabel(ym).toLowerCase()}.</div>`}
  <p class="small mut" style="margin-top:10px">Contabilidad por flujo de caja: los abonos se registran como ingreso al verificarse, el saldo al cobrar el servicio y las ventas de productos al venderse. Las compras de inventario, comisiones y gastos se registran como egresos.</p></div>`}

/* ---- Reportes ---- */
function pReportes(){
  const ym=P.repMes;const cs=S.citas.filter(c=>ymOf(c.fecha)===ym);const f=finMes(ym);
  const at=cs.filter(c=>c.estado==='atendida');
  const months=Array.from({length:6},(_,i)=>ymAdd(ym,i-5));const mf=months.map(m=>finMes(m));const mx=Math.max(1,...mf.map(x=>Math.max(x.ti,x.te)));
  const bRows=barberos().map(b=>{const ing=sum(f.ing.filter(m=>m.barberoId===b.id&&['Abonos','Servicios'].includes(m.categoria)),m=>m.monto);const pag=sum(f.egr.filter(m=>m.barberoId===b.id&&m.categoria==='Comisiones barberos'),m=>m.monto);const com=Math.round(ing*(Number(b.comision)||0)/100);return {b,n:at.filter(c=>c.barberoId===b.id).length,ing,com,pag,prop:sum(f.ing.filter(m=>m.barberoId===b.id&&m.categoria==='Propinas'),m=>m.monto)}});
  const sRows={};cs.filter(activa).forEach(c=>{const k=c.servicioNombre;sRows[k]=sRows[k]||{n:0,v:0};sRows[k].n++;if(c.estado==='atendida')sRows[k].v+=Number(c.precio)});
  const sArr=Object.entries(sRows).sort((a,b)=>b[1].n-a[1].n);const smx=Math.max(1,...sArr.map(s=>s[1].n));
  const pRows={};S.ventas.filter(v=>ymOf(v.fecha)===ym).forEach(v=>(v.items||[]).forEach(i=>{pRows[i.nombre]=pRows[i.nombre]||{n:0,v:0};pRows[i.nombre].n+=i.cant;pRows[i.nombre].v+=i.cant*i.precio}));
  const pArr=Object.entries(pRows).sort((a,b)=>b[1].v-a[1].v);const pmx=Math.max(1,...pArr.map(p=>p[1].v));
  const hrs={};cs.filter(activa).forEach(c=>{const h=c.hora.slice(0,2);hrs[h]=(hrs[h]||0)+1});const hArr=Object.entries(hrs).sort();const hmx=Math.max(1,...hArr.map(h=>h[1]));
  return `<div class="ph"><h2>Reportes</h2><span class="sp"></span><button class="btn sm" data-act="repMes" data-n="-1">${ico('left')}</button><b>${ymLabel(ym)}</b><button class="btn sm" data-act="repMes" data-n="1">${ico('right')}</button></div>
  <div class="kpis"><div class="kpi"><small>Citas agendadas</small><b>${cs.length}</b></div><div class="kpi" style="--k:var(--green)"><small>Atendidas</small><b>${at.length}</b></div><div class="kpi" style="--k:var(--red)"><small>Canceladas / no asistió</small><b>${cs.filter(c=>!activa(c)).length}</b></div><div class="kpi" style="--k:var(--blue)"><small>Ticket promedio</small><b>${fmt(at.length?sum(at,c=>c.precio)/at.length:0)}</b></div><div class="kpi" style="--k:var(--purple)"><small>Reservas en línea</small><b>${cs.filter(c=>c.origen==='web').length}</b></div></div>
  <div class="card"><div class="card-h"><span class="ic">${ico('chart')}</span><h3>Ingresos vs egresos · últimos 6 meses</h3><span class="sp"></span><div class="legend"><span><i style="background:var(--gold)"></i>Ingresos</span><span><i style="background:#ff6b6b"></i>Egresos</span></div></div>
    <div class="vchart">${mf.map((x,i)=>`<div class="g"><i style="height:${x.ti/mx*100}%;background:linear-gradient(180deg,var(--gold2),var(--goldd))" title="Ingresos ${fmt(x.ti)}"></i><i style="height:${x.te/mx*100}%;background:#ff6b6b" title="Egresos ${fmt(x.te)}"></i><span>${MESC[parseD(months[i]+'-01').getMonth()]}</span></div>`).join('')}</div></div>
  <div class="card"><div class="card-h"><span class="ic">${ico('users')}</span><h3>Desempeño y comisiones por barbero</h3></div><div class="tblwrap"><table class="tbl"><tr><th>Barbero</th><th>Servicios atendidos</th><th>Ingresos generados</th><th>Comisión</th><th>Propinas</th><th>Pagado</th><th>Por pagar</th><th></th></tr>${bRows.map(r=>`<tr><td><div class="row"><span class="avatar" style="width:30px;height:30px;font-size:11px;background:${r.b.color}">${esc(initials(r.b.nombre))}</span><b>${esc(r.b.nombre)}</b></div></td><td>${r.n}</td><td>${fmt(r.ing)}</td><td>${fmt(r.com)} <span class="small mut">(${r.b.comision||0}%)</span></td><td>${fmt(r.prop)}</td><td>${fmt(r.pag)}</td><td class="b gold">${fmt(Math.max(0,r.com-r.pag))}</td><td>${r.com-r.pag>0?`<button class="btn sm" data-act="pagarCom" data-id="${r.b.id}" data-v="${r.com-r.pag}">Registrar pago</button>`:''}</td></tr>`).join('')}</table></div></div>
  <div class="dash3">
    <div class="card"><div class="card-h"><span class="ic">${ico('scissors')}</span><h3>Servicios más solicitados</h3></div>${sArr.length?`<div class="hbar">${sArr.map(([k,v])=>`<div class="r"><span>${esc(k)}</span><div class="tr"><i style="width:${v.n/smx*100}%"></i></div><span class="v">${v.n} · ${fmt(v.v)}</span></div>`).join('')}</div>`:'<div class="empty">Sin datos.</div>'}</div>
    <div class="card"><div class="card-h"><span class="ic">${ico('box')}</span><h3>Productos más vendidos</h3></div>${pArr.length?`<div class="hbar">${pArr.map(([k,v])=>`<div class="r"><span>${esc(k)}</span><div class="tr"><i style="width:${v.v/pmx*100}%;background:var(--cyan)"></i></div><span class="v">${v.n} und · ${fmt(v.v)}</span></div>`).join('')}</div>`:'<div class="empty">Sin ventas este mes.</div>'}</div>
    <div class="card"><div class="card-h"><span class="ic">${ico('clock')}</span><h3>Horas de mayor demanda</h3></div>${hArr.length?`<div class="hbar">${hArr.map(([k,v])=>`<div class="r"><span>${h12(k+':00')}</span><div class="tr"><i style="width:${v/hmx*100}%;background:var(--purple)"></i></div><span class="v">${v} citas</span></div>`).join('')}</div>`:'<div class="empty">Sin datos.</div>'}</div>
  </div>`}

/* ---- Configuración ---- */
function pConfig(){
  const c=cfg();
  return `<div class="ph"><h2>Configuración</h2><span class="sp"></span><button class="btn gold" data-act="saveCfg">${ico('check')} Guardar cambios</button></div>

  <div class="card"><div class="card-h"><span class="ic">${ico('wallet')}</span><h3>Abono y pagos</h3></div><div class="grid2"><div><label class="f">Abono (% del servicio)</label><input class="in" type="number" id="cf-abonoPct" min="0" max="100" value="${c.abonoPct}"></div><div><label class="f">Abono mínimo ($)</label><input class="in" id="cf-abonoMin" inputmode="numeric" value="${c.abonoMin}"></div>
  <div><label class="f">Nequi</label><input class="in" id="cf-nequi" value="${esc(c.nequi)}"></div><div><label class="f">Daviplata</label><input class="in" id="cf-daviplata" value="${esc(c.daviplata)}"></div><div><label class="f">Cuenta bancaria</label><input class="in" id="cf-banco" value="${esc(c.banco)}"></div><div><label class="f">Titular</label><input class="in" id="cf-titular" value="${esc(c.titular)}"></div></div>

function barbModal(id){
  const b=id?barberos().find(x=>x.id===id):{nombre:'',pin:'0000',comision:40,activo:true,color:AV_COLORS[barberos().length%AV_COLORS.length]};
  openModal(id?'Editar barbero':'Nuevo barbero',`<div class="grid2"><div><label class="f">Nombre</label><input class="in" id="bb-n" value="${esc(b.nombre)}"></div><div><label class="f">PIN de acceso</label><input class="in" id="bb-p" value="${esc(b.pin)}" inputmode="numeric"></div><div><label class="f">Comisión sobre servicios (%)</label><input class="in" type="number" id="bb-c" min="0" max="100" value="${b.comision}"></div><div><label class="f">Color en agenda</label><input class="in" type="color" id="bb-col" value="${b.color}" style="height:42px;padding:4px"></div></div><label class="chk"><input type="checkbox" id="bb-a" ${b.activo!==false?'checked':''}> Activo (recibe reservas)</label>`,
  `${id?`<button class="btn ghost" style="margin-right:auto;color:#ff8787" data-act="delBarb" data-id="${id}">${ico('trash')} Eliminar</button>`:''}<button class="btn" data-act="mclose">Cancelar</button><button class="btn gold" data-act="saveBarb" data-id="${id||''}">Guardar</button>`)}

/* ================= acciones ================= */
const ACT={
  ovclose:(d,el,e)=>{if(e.target===el)closeModal()},mclose:()=>closeModal(),
  goto:d=>{if(d.t==='top'){window.scrollTo({top:0,behavior:'smooth'});return}const t=document.getElementById(d.t);if(t){const y=t.getBoundingClientRect().top+window.scrollY-84;window.scrollTo({top:y,behavior:'smooth'})}},
  agendarCon:d=>{closeModal();B.barberoId=d.id;B.hora=null;B.fecha=null;B.done=null;B.step=B.servicioId?2:1;render();ACT.goto({t:'sec-reservar'})},
  verBarberos:()=>{const bs=barberos().filter(b=>b.activo!==false);openModal('Nuestros barberos',`<img src="${IMG.barberos}" alt="" style="width:100%;border-radius:12px;display:block">${bs.map(b=>`<div class="nx"><span class="avatar" style="background:${b.color}">${esc(initials(b.nombre))}</span><div><div class="b">${esc(b.nombre)}</div><div class="small mut">Barbero · estilo urbano</div></div><span class="sp"></span><button class="btn gold sm" data-act="agendarCon" data-id="${b.id}">Agendar con él</button></div>`).join('')}`)},
  quickGo:()=>{if(!Q.svc)return toast('Selecciona un servicio.','err');if(!Q.fecha)return toast('Selecciona la fecha.','err');if(!Q.hora)return toast('Selecciona la hora.','err');
    Object.assign(B,{servicioId:Q.svc,barberoId:Q.barb||'any',fecha:Q.fecha,hora:Q.hora,step:3,done:null});render();ACT.goto({t:'sec-reservar'})},
  pickSvc:d=>{const scroll=d.scroll;if(B.servicioId!==d.id){B.servicioId=d.id;B.hora=null;B.fecha=null}if(scroll){B.step=2;B.done=null}render();if(scroll)setTimeout(()=>document.getElementById('sec-reservar').scrollIntoView({behavior:'smooth'}),30)},
  pickBarb:d=>{B.barberoId=d.id;B.hora=null;render()},
  pickDay:d=>{B.fecha=d.d;B.hora=null;render()},
  pickHora:d=>{B.hora=d.h;render()},
  pickMetodo:d=>{B.metodo=d.m;render()},
  toggleApartar:d=>{B.apartar=B.apartar.includes(d.id)?B.apartar.filter(x=>x!==d.id):[...B.apartar,d.id];render()},
  wzBack:()=>{B.step=Math.max(1,B.step-1);render()},
  wzNext:()=>{B.step++;render();document.getElementById('sec-reservar').scrollIntoView({behavior:'smooth'})},
  wzReset:()=>{Object.assign(B,{step:1,servicioId:null,barberoId:'any',fecha:null,hora:null,referencia:'',comprobante:'',acepta:false,apartar:[],done:null});render()},
  wzSubmit:async()=>{
    const s=serv(B.servicioId);let bid=B.barberoId;const t=toMin(B.hora);
    if(bid==='any'){const m=slotsAny(B.fecha,s.duracion);const opts=m[t]||[];if(!opts.length){toast('Ese horario acaba de ocuparse. Elige otro.','err');B.step=2;B.hora=null;return render()}
      const load=id=>S.citas.filter(c=>c.barberoId===id&&c.fecha===B.fecha&&activa(c)).length;bid=opts.sort((a,b)=>load(a)-load(b))[0]}
    else if(!slotsLibres(bid,B.fecha,s.duracion).includes(t)){toast('Ese horario acaba de ocuparse. Elige otro.','err');B.step=2;B.hora=null;return render()}
    const c=cfg();const ab=calcAbono(s.precio);const auto=!!c.autoConfirmar;
    const cita={id:uid('ct'),codigo:codigoCita(),cliente:B.nombre.trim(),telefono:B.telefono.trim(),email:B.email.trim(),notas:B.notas.trim(),servicioId:s.id,servicioNombre:s.nombre,duracion:Number(s.duracion),precio:Number(s.precio),barberoId:bid,fecha:B.fecha,hora:B.hora,abono:ab,metodoAbono:B.metodo,referencia:B.referencia.trim(),comprobante:B.comprobante,abonoPagado:auto,estado:auto?'confirmada':'en_espera',origen:'web',apartar:B.apartar.slice(),creada:Date.now()};
    $('#wz-next').disabled=true;
    await saveItem('citas',cita,true);
    if(auto)await saveItem('movimientos',mov({tipo:'ingreso',categoria:'Abonos',concepto:`Abono ${cita.codigo} · ${cita.cliente}`,monto:ab,metodo:cita.metodoAbono,citaId:cita.id,barberoId:bid}),true);
    await upsertCliente(cita.cliente,cita.telefono,cita.email);
    B.done=cita;MC.tel=cita.telefono;render();document.getElementById('sec-reservar').scrollIntoView({behavior:'smooth'});
  },
  pubCancel:async d=>{const x=S.citas.find(c=>c.id===d.id);if(!x)return;openModal('Cancelar cita',`<p>¿Seguro que deseas cancelar tu cita del ${fLarga(x.fecha)} a las ${h12(x.hora)}?</p><p class="small mut">${esc(cfg().politica)}</p>`,`<button class="btn" data-act="mclose">No, volver</button><button class="btn red" data-act="pubCancelOk" data-id="${x.id}">Sí, cancelar</button>`)},

  sideBg:(d,el,e)=>{if(e.target===el&&P.side){}},

  newCita:()=>newCitaModal(),
  saveNewCita:async()=>{
    const nom=val('nc-nom'),tel=val('nc-tel'),s=serv(val('nc-svc')),bid=val('nc-barb'),f=val('nc-fecha'),h=val('nc-hora');

    const cita={id:uid('ct'),codigo:codigoCita(),cliente:nom,telefono:tel,email:'',notas:val('nc-notas'),servicioId:s.id,servicioNombre:s.nombre,duracion:Number(s.duracion),precio:Number(s.precio),barberoId:bid,fecha:f,hora:h,abono:ab,metodoAbono:conAb?val('nc-abm'):'',referencia:'',abonoPagado:conAb&&ab>0,estado:conAb&&ab>0?'confirmada':'pendiente',origen:'equipo',creada:Date.now()};
    closeModal();await saveItem('citas',cita,true);
    if(cita.abonoPagado)await saveItem('movimientos',mov({tipo:'ingreso',categoria:'Abonos',concepto:`Abono ${cita.codigo} · ${nom}`,monto:ab,metodo:cita.metodoAbono,citaId:cita.id,barberoId:bid}),true);
    await upsertCliente(nom,tel,'');P.agFecha=f;render();toast('Cita agendada.')},
  verificar:async d=>{const x=S.citas.find(c=>c.id===d.id);if(!x)return;closeModal();
    await saveItem('citas',{...x,estado:'confirmada',abonoPagado:true,verificada:Date.now()},true);
    await saveItem('movimientos',mov({tipo:'ingreso',categoria:'Abonos',concepto:`Abono ${x.codigo} · ${x.cliente}`,monto:x.abono,metodo:x.metodoAbono||'nequi',citaId:x.id,barberoId:x.barberoId}),true);render();toast('Abono verificado: cita confirmada.')},
  rechazar:d=>{const x=S.citas.find(c=>c.id===d.id);openModal('Rechazar abono',`<p>El abono de <b>${esc(x.cliente)}</b> (${fmt(x.abono)}, ref. ${esc(x.referencia||'—')}) no se pudo verificar.</p><p class="small mut">La cita quedará cancelada y el horario se liberará. Recuerda avisar al cliente por WhatsApp: ${esc(x.telefono)}.</p>`,`<button class="btn" data-act="mclose">Volver</button><button class="btn red" data-act="rechazarOk" data-id="${x.id}">Rechazar y liberar horario</button>`)},
  rechazarOk:async d=>{const x=S.citas.find(c=>c.id===d.id);closeModal();await saveItem('citas',{...x,estado:'cancelada',motivo:'Abono no verificado'});toast('Cita cancelada.')},
  abonoManual:d=>{const x=S.citas.find(c=>c.id===d.id);openModal('Registrar abono',`<div class="grid2"><div><label class="f">Valor</label><input class="in" id="am-v" inputmode="numeric" value="${calcAbono(x.precio)}"></div><div><label class="f">Método</label><select class="in" id="am-m">${Object.entries(METODOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div>`,`<button class="btn" data-act="mclose">Cancelar</button><button class="btn gold" data-act="abonoManualOk" data-id="${x.id}">Guardar</button>`)},
  abonoManualOk:async d=>{const x=S.citas.find(c=>c.id===d.id);const v=num('am-v'),m=val('am-m');if(!v)return toast('Escribe el valor del abono.','err');closeModal();
    await saveItem('citas',{...x,abono:v,metodoAbono:m,abonoPagado:true,estado:'confirmada'},true);
    await saveItem('movimientos',mov({tipo:'ingreso',categoria:'Abonos',concepto:`Abono ${x.codigo} · ${x.cliente}`,monto:v,metodo:m,citaId:x.id,barberoId:x.barberoId}),true);render();toast('Abono registrado.')},
  cobrar:d=>cobrarModal(d.id),
  saveCobro:async d=>{const x=S.citas.find(c=>c.id===d.id);const v=num('cb-v'),m=val('cb-m'),p=num('cb-p');closeModal();
    await saveItem('citas',{...x,estado:'atendida',saldoPagado:v,metodoSaldo:m,propina:p,atendida:Date.now()},true);

    if(p)await saveItem('movimientos',mov({tipo:'ingreso',categoria:'Propinas',concepto:`Propina · ${x.cliente}`,monto:p,metodo:m,citaId:x.id,barberoId:x.barberoId}),true);
    render();toast('Servicio cobrado y finalizado.')},
  noAsistio:async d=>{const x=S.citas.find(c=>c.id===d.id);closeModal();await saveItem('citas',{...x,estado:'no_asistio'});toast('Marcada como no asistió. El abono se conserva según la política.')},
  cancelarCita:d=>{const x=S.citas.find(c=>c.id===d.id);openModal('Cancelar cita',`<p>Cancelar la cita de <b>${esc(x.cliente)}</b> · ${fLarga(x.fecha)} ${h12(x.hora)}.</p>${x.abonoPagado?`<label class="chk"><input type="checkbox" id="cc-dev"> Devolver el abono (${fmt(x.abono)}) — se registra como egreso</label>`:''}`,`<button class="btn" data-act="mclose">Volver</button><button class="btn red" data-act="cancelarOk" data-id="${x.id}">Cancelar cita</button>`)},

  entradaOk:async d=>{const p=S.productos.find(x=>x.id===d.id);const q=Number(val('en-q'))||0,co=num('en-c'),m=val('en-m'),eg=$('#en-eg').checked;if(q<1)return;closeModal();

  newVenta:()=>{CART={};ventaModal()},
  cart:d=>{const p=S.productos.find(x=>x.id===d.id);const m=$('#vt-m')?val('vt-m'):'efectivo',cl=val('vt-c');CART[d.id]=Math.max(0,Math.min(Number(p.stock),(CART[d.id]||0)+Number(d.n)));ventaModal();$('#vt-m').value=m;$('#vt-c').value=cl},
  saveVenta:async()=>{const items=Object.entries(CART).filter(([,q])=>q>0).map(([id,q])=>{const p=S.productos.find(x=>x.id===id);return {id,nombre:p.nombre,precio:Number(p.precio),costo:Number(p.costo)||0,cant:q}});
    const total=sum(items,i=>i.precio*i.cant);const m=val('vt-m'),cl=val('vt-c');closeModal();
    const v={id:uid('v'),fecha:today(),hora:nowHM(),ts:Date.now(),items,total,metodo:m,cliente:cl,vendedor:SES.nombre,barberoId:SES.barberoId||''};
    await saveItem('ventas',v,true);
    for(const i of items){const p=S.productos.find(x=>x.id===i.id);await saveItem('productos',{...p,stock:Math.max(0,Number(p.stock)-i.cant)},true)}
    await saveItem('movimientos',mov({tipo:'ingreso',categoria:'Productos',concepto:'Venta: '+items.map(i=>`${i.cant}× ${i.nombre}`).join(', '),monto:total,metodo:m,ventaId:v.id,barberoId:SES.barberoId||''}),true);
    CART={};render();toast('Venta registrada.')},
  cajaMes:d=>{P.cajaMes=ymAdd(P.cajaMes,Number(d.n));render()},
  repMes:d=>{P.repMes=ymAdd(P.repMes,Number(d.n));render()},
  movTipo:d=>{P.movTipo=d.t;render()},
  newMov:d=>movModal(d.t),
  saveMov:async d=>{const v=num('mv-v'),c=val('mv-c');if(!v||!c)return toast('Escribe el concepto y el valor.','err');const f=val('mv-f')||today();closeModal();
    await saveItem('movimientos',mov({tipo:d.t,categoria:val('mv-cat'),concepto:c,monto:v,metodo:val('mv-m'),fecha:f,barberoId:val('mv-b')}));toast('Movimiento registrado.')},
  delMov:d=>openModal('Eliminar movimiento',`<p>¿Eliminar este movimiento del libro de caja?</p>`,`<button class="btn" data-act="mclose">Volver</button><button class="btn red" data-act="delMovOk" data-id="${d.id}">Eliminar</button>`),
  delMovOk:async d=>{closeModal();await delItem('movimientos',d.id);toast('Movimiento eliminado.')},
  copyCSV:async()=>{const f=finMes(P.cajaMes);const rows=[['Fecha','Hora','Tipo','Categoría','Concepto','Método','Barbero','Valor']].concat(f.ms.sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).map(m=>[m.fecha,m.hora,m.tipo,m.categoria,m.concepto,METODOS[m.metodo]||m.metodo,m.barberoId?barb(m.barberoId).nombre:'',(m.tipo==='egreso'?-1:1)*m.monto]));
    const csv=rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\n');
    try{await navigator.clipboard.writeText(csv);toast('CSV copiado: pégalo en Excel o Google Sheets.')}catch(e){openModal('Copiar CSV',`<p class="small mut">Selecciona y copia el texto:</p><textarea class="in" rows="10" readonly>${esc(csv)}</textarea>`,'',true)}},
  pagarCom:d=>{const b=barb(d.id);openModal('Pago de comisión',`<p>Registrar pago de comisión a <b>${esc(b.nombre)}</b> correspondiente a ${ymLabel(P.repMes).toLowerCase()}.</p><div class="grid2"><div><label class="f">Valor</label><input class="in" id="pc-v" inputmode="numeric" value="${d.v}"></div><div><label class="f">Método</label><select class="in" id="pc-m">${Object.entries(METODOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div>`,`<button class="btn" data-act="mclose">Cancelar</button><button class="btn gold" data-act="pagarComOk" data-id="${d.id}">Registrar egreso</button>`)},
  pagarComOk:async d=>{const v=num('pc-v');if(!v)return;const m=val('pc-m');closeModal();const ym=P.repMes;const fecha=ym===today().slice(0,7)?today():ym+'-28';
    await saveItem('movimientos',mov({tipo:'egreso',categoria:'Comisiones barberos',concepto:`Comisión ${barb(d.id).nombre} · ${ymLabel(ym)}`,monto:v,metodo:m,barberoId:d.id,fecha}));toast('Pago de comisión registrado.')},
  saveCfg:async()=>{const c=cfg();const n={...c};['nombre','eslogan','direccion','telefono','instagram','tiktok','facebook','whatsapp','apertura','cierre','descansoIni','descansoFin','nequi','daviplata','banco','titular','politica','pinAdmin'].forEach(k=>{const e=document.getElementById('cf-'+k);if(e)n[k]=e.value.trim()});
    n.intervalo=Number(val('cf-intervalo'))||15;n.diasReserva=Number(val('cf-diasReserva'))||14;n.abonoPct=Number(val('cf-abonoPct'))||0;n.abonoMin=num('cf-abonoMin');n.stockMin=Number(val('cf-stockMin'))||0;n.autoConfirmar=$('#cf-autoConfirmar').checked;
    n.dias=[...document.querySelectorAll('.cf-dia:checked')].map(e=>Number(e.value));
    if(toMin(n.cierre)<=toMin(n.apertura))return toast('La hora de cierre debe ser posterior a la apertura.','err');
    if(!n.pinAdmin)return toast('El PIN del administrador no puede quedar vacío.','err');
    await saveCfg(n);toast('Configuración guardada.')},
  editBarb:d=>barbModal(d.id),
  saveBarb:async d=>{const n=val('bb-n');if(!n)return toast('Escribe el nombre.','err');const ex=d.id?barberos().find(x=>x.id===d.id):{id:uid('b')};closeModal();
    await saveItem('barberos',{...ex,nombre:n,pin:val('bb-p')||'0000',comision:Number(val('bb-c'))||0,color:val('bb-col'),activo:$('#bb-a').checked});toast('Barbero guardado.')},
  delBarb:d=>{const n=S.citas.filter(c=>c.barberoId===d.id&&activa(c)&&c.fecha>=today()).length;if(n){toast(`Tiene ${n} citas futuras. Desactívalo en lugar de eliminarlo.`,'err');return}closeModal();delItem('barberos',d.id)},
};
document.addEventListener('click',e=>{if(P.side&&!e.target.closest('.side')&&!e.target.closest('[data-act="toggleSide"]')){P.side=false;render();return}const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(!ACT[a])return;if(a==='ovclose'&&e.target!==el)return;if(el.tagName==='BUTTON'||el.tagName==='A')e.preventDefault();ACT[a](el.dataset,el,e)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.b){B[t.dataset.b]=t.type==='checkbox'?t.checked:t.value;const n=$('#wz-next');if(n){const ok=B.step===3?(B.nombre.length>2&&digits(B.telefono).length>=7):B.step===4?(B.referencia.length>=3&&B.acepta):true;n.disabled=!ok}}
  if(t.id==='cli-q'){P.cliQ=t.value;const pos=t.selectionStart;render();const n=$('#cli-q');n.focus();n.setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.b==='acepta'){B.acepta=t.checked;const n=$('#wz-next');if(n)n.disabled=!(B.referencia.length>=3&&B.acepta)}
  if(t.id==='comp-file'){B.comprobante=t.files&&t.files[0]?t.files[0].name:''}
  if(t.id==='ag-date'&&t.value){P.agFecha=t.value;render()}
  if(t.id==='ag-barb'){P.agBarb=t.value;render()}
  if(t.id&&t.id.startsWith('q-')){Q[t.id.slice(2)]=t.value;if(t.id!=='q-hora'){if(t.id!=='q-fecha'||!t.value)Q.hora='';Q.hora=t.id==='q-fecha'?'':Q.hora}render()}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
  if(f==='login'){const u=val('lg-user'),pin=val('lg-pin');const c=cfg();
    if(u==='admin'){if(pin===String(c.pinAdmin)){setSes({rol:'admin',nombre:'Administrador'});P.mod='inicio';render()}else toast('PIN incorrecto.','err')}
    else{const b=barb(u);if(pin===String(b.pin)){setSes({rol:'barbero',barberoId:b.id,nombre:b.nombre});P.mod='inicio';render()}else toast('PIN incorrecto.','err')}}

/* ================= modo demostración ================= */
function seedDemo(){
  COLS.forEach(c=>S[c]=[]);S.config=null;
  S.servicios=clone(DEF_SERV);S.barberos=clone(DEF_BARB);
  S.productos=[
   {id:'p1',nombre:'Cera mate',categoria:'Fijación',precio:35000,costo:18000,stock:12,minimo:3,visible:true},
   {id:'p2',nombre:'Pomada brillo',categoria:'Fijación',precio:32000,costo:16000,stock:8,minimo:3,visible:true},
   {id:'p3',nombre:'Aceite para barba',categoria:'Cuidado de la barba',precio:45000,costo:24000,stock:6,minimo:3,visible:true},
   {id:'p4',nombre:'Shampoo anticaída',categoria:'Cuidado del cabello',precio:38000,costo:20000,stock:2,minimo:3,visible:true},
   {id:'p5',nombre:'Bálsamo after shave',categoria:'Cuidado de la barba',precio:30000,costo:15000,stock:10,minimo:3,visible:true}];
  const NOM=['Juan Pérez','Andrés Gómez','Carlos Ruiz','Felipe Castro','Diego Torres','Santiago López','Julián Martínez','Camilo Vargas','Sebastián Ortiz','Daniel Moreno','Nicolás Herrera','Alejandro Ríos','Miguel Ángel Paz','Esteban Cruz','David Salazar','Óscar Mejía','Tomás Rincón','Luis Fernando Gil','Brayan Muñoz','Jhon Ocampo'];
  const cli=NOM.map((n,i)=>({id:'c300'+(1000000+i*7919),nombre:n,telefono:'300'+(1000000+i*7919),email:'',notas:'',creado:addDays(today(),-60)}));
  S.clientes=cli.slice();
  const R=Math.random,pick=a=>a[Math.floor(R()*a.length)],c=cfg(),met=['efectivo','efectivo','nequi','daviplata','transferencia','tarjeta'];
  const nowM=toMin(nowHM()),T=today();
  for(let d=-100;d<=7;d++){const f=addDays(T,d);if(!diaAbierto(f))continue;
    for(const b of S.barberos){let t=toMin(c.apertura)+pick([0,15,30]);
      while(true){t+=pick([0,0,15,30,45,60,90]);const s=pick(S.servicios);if(t<toMin(c.descansoFin)&&t+s.duracion>toMin(c.descansoIni)){t=toMin(c.descansoFin);continue}if(t+s.duracion>toMin(c.cierre))break;
        if(d>0&&R()<.45){t+=s.duracion;continue}
        const cl=pick(cli);const past=d<0||(d===0&&t+s.duracion<=nowM);const ab=calcAbono(s.precio);const web=R()<.7;
        let est;if(past){const r=R();est=r<.86?'atendida':r<.94?'no_asistio':'cancelada'}else{const r=R();est=r<.82?'confirmada':r<.9?'en_espera':'pendiente'}
        const id=uid('ct');const abP=web?est!=='en_espera'&&!(est==='cancelada'&&R()<.5):(est==='confirmada'||est==='atendida')&&R()<.4;
        const cita={id,codigo:codigoCita(),cliente:cl.nombre,telefono:cl.telefono,email:'',notas:'',servicioId:s.id,servicioNombre:s.nombre,duracion:s.duracion,precio:s.precio,barberoId:b.id,fecha:f,hora:toHM(t),abono:abP||est==='en_espera'||web?ab:0,metodoAbono:web?pick(['nequi','daviplata','transferencia']):'efectivo',referencia:web?'M'+Math.floor(1e6+R()*9e6):'',abonoPagado:abP,estado:est==='pendiente'&&web?'confirmada':est,origen:web?'web':'equipo',creada:Date.now()};
        if(!web&&!abP&&est==='confirmada')cita.estado='pendiente';
        const abF=d>=0?addDays(T,-Math.floor(R()*4)):f;const hm=toHM(d>=0&&abF===T?Math.floor(R()*Math.max(1,nowM-480))+420:Math.max(420,t-60-Math.floor(R()*240)));
        if(abP)S.movimientos.push(mov({tipo:'ingreso',categoria:'Abonos',concepto:`Abono ${cita.codigo} · ${cita.cliente}`,monto:cita.abono,metodo:cita.metodoAbono,citaId:id,barberoId:b.id,fecha:abF,hora:hm}));
        if(cita.estado==='atendida'){const sal=s.precio-(abP?cita.abono:0);const m=pick(met);cita.saldoPagado=sal;cita.metodoSaldo=m;
          S.movimientos.push(mov({tipo:'ingreso',categoria:'Servicios',concepto:`${s.nombre} · ${cl.nombre}`,monto:sal,metodo:m,citaId:id,barberoId:b.id,fecha:f,hora:toHM(t+s.duracion)}));
          if(R()<.18){const p=pick([2000,3000,5000]);cita.propina=p;S.movimientos.push(mov({tipo:'ingreso',categoria:'Propinas',concepto:`Propina · ${cl.nombre}`,monto:p,metodo:m,citaId:id,barberoId:b.id,fecha:f,hora:toHM(t+s.duracion)}))}}
        S.citas.push(cita);t+=s.duracion;}}
    if(d<=0&&R()<.6){const n=1+Math.floor(R()*2);const items=[];for(let k=0;k<n;k++){const p=pick(S.productos);if(!items.find(i=>i.id===p.id))items.push({id:p.id,nombre:p.nombre,precio:p.precio,costo:p.costo,cant:1})}
      const tot=sum(items,i=>i.precio*i.cant);const m=pick(met);const v={id:uid('v'),fecha:f,hora:'1'+Math.floor(R()*8)+':'+pick(['05','20','40']),ts:Date.now()+d,items,total:tot,metodo:m,cliente:pick(cli).nombre,vendedor:pick(S.barberos).nombre};
      S.ventas.push(v);S.movimientos.push(mov({tipo:'ingreso',categoria:'Productos',concepto:'Venta: '+items.map(i=>`${i.cant}× ${i.nombre}`).join(', '),monto:tot,metodo:m,ventaId:v.id,fecha:f,hora:v.hora}))}}
  const ym=T.slice(0,7);for(const m of [ymAdd(ym,-3),ymAdd(ym,-2),ymAdd(ym,-1),ym]){const f1=m+'-01',f5=m+'-05';
    S.movimientos.push(mov({tipo:'egreso',categoria:'Arriendo',concepto:'Arriendo local · '+ymLabel(m),monto:1200000,metodo:'transferencia',fecha:f1,hora:'09:00'}));
    S.movimientos.push(mov({tipo:'egreso',categoria:'Servicios públicos',concepto:'Energía, agua e internet',monto:280000,metodo:'transferencia',fecha:f5,hora:'10:00'}));
    S.movimientos.push(mov({tipo:'egreso',categoria:'Insumos',concepto:'Cuchillas, talco, toallas desechables',monto:180000,metodo:'efectivo',fecha:m+'-03',hora:'11:00'}));
    S.movimientos.push(mov({tipo:'egreso',categoria:'Compra de productos',concepto:'Reposición de inventario',monto:380000,metodo:'transferencia',fecha:m+'-02',hora:'15:00'}));}
  [ymAdd(ym,-3),ymAdd(ym,-2),ymAdd(ym,-1)].forEach(prev=>S.barberos.forEach(b=>{const ing=sum(S.movimientos.filter(m=>m.tipo==='ingreso'&&m.barberoId===b.id&&ymOf(m.fecha)===prev&&['Abonos','Servicios'].includes(m.categoria)),m=>m.monto);
    if(ing)S.movimientos.push(mov({tipo:'egreso',categoria:'Comisiones barberos',concepto:`Comisión ${b.nombre} · ${ymLabel(prev)}`,monto:Math.round(ing*b.comision/100),metodo:'transferencia',barberoId:b.id,fecha:prev+'-28',hora:'18:00'}))}));
  S.movimientos=S.movimientos.filter(m=>m.fecha<=T);
  S.demoSeed=T;lsSave();
}
function startDemo(){lsLoad();if(!S.citas.length||!S.demoSeed)seedDemo();
  const n=$('#net');n.innerHTML='Modo demostración · Los cambios se guardan solo en este navegador · Acceso del equipo: administrador PIN <b>1234</b>, barberos PIN <b>0000</b> · <button class="btn sm" style="margin-left:8px" data-act="resetDemo">Restablecer demo</button>';n.classList.remove('hidden');}
ACT.resetDemo=()=>{if(dbMode!=='local')return;try{localStorage.removeItem(LS)}catch(e){}seedDemo();render();toast('Demostración restablecida con datos de ejemplo.')};
const DEMO=true; // versión de demostración: datos de ejemplo por navegador, sin pagos reales
startDemo();render();
if(!DEMO)initDB().then(()=>render());
